<!doctype html>
<html lang="ja" style="background:#131314">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>予定手帖</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="予定手帖">
  <meta name="theme-color" content="#131314">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="title-row">
      <button class="icon-btn" id="prevBtn" aria-label="前の月">‹</button>
      <h1 id="monthTitle">　</h1>
      <button class="icon-btn" id="nextBtn" aria-label="次の月">›</button>
    </div>
    <div class="tool-row">
      <button class="pill" id="todayBtn">今日</button>
      <span class="status" id="status"></span>
      <button class="icon-btn small" id="refreshBtn" aria-label="更新">↻</button>
      <button class="icon-btn small" id="settingsBtn" aria-label="設定">⚙</button>
    </div>
    <div class="weekdays">
      <div class="sun">日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div class="sat">土</div>
    </div>
  </header>

  <main id="calendar" class="calendar" aria-live="polite"></main>

  <section class="legend-wrap">
    <h2>色の凡例（協力会社）</h2>
    <ul id="legend" class="legend"></ul>
  </section>

  <!-- 予定の詳細 -->
  <div class="sheet-backdrop" id="detailBackdrop" hidden>
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-color" id="detailColor"></div>
      <h3 id="detailTitle"></h3>
      <dl class="detail-list" id="detailList"></dl>
      <button class="wide-btn" id="detailClose">閉じる</button>
    </div>
  </div>

  <!-- 設定 -->
  <div class="sheet-backdrop" id="settingsBackdrop" hidden>
    <div class="sheet" role="dialog" aria-modal="true">
      <h3>設定</h3>
      <p class="note">Apps Script をデプロイしたときの「ウェブアプリのURL」と、Code.gs に書いた「合言葉」を入れてください。</p>
      <label class="field">ウェブアプリのURL
        <input type="url" id="apiUrlInput" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" autocapitalize="off" spellcheck="false">
      </label>
      <label class="field">合言葉
        <input type="text" id="apiKeyInput" autocomplete="off" autocapitalize="off" spellcheck="false">
      </label>
      <div class="field">文字の大きさ
        <div class="seg" id="fontSeg">
          <button data-size="0.9">小</button><button data-size="1">中</button><button data-size="1.15">大</button><button data-size="1.3">特大</button>
        </div>
      </div>
      <p class="error" id="settingsError" hidden></p>
      <button class="wide-btn primary" id="settingsSave">保存して読み込む</button>
      <button class="wide-btn" id="demoBtn">デモの予定で見てみる</button>
      <button class="wide-btn" id="settingsClose">閉じる</button>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
